name: Apply full AmberMail project
on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Zip file name in the release"
        default: "ambermail-complete.zip"
      release_tag:
        description: "Release tag"
        default: "assets"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download zip from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.release_tag }}" -p "${{ inputs.zip_name }}" -D /tmp/dl --repo "$GITHUB_REPOSITORY"

      - name: Extract into repo
        run: |
          mkdir /tmp/x && unzip -q "/tmp/dl/${{ inputs.zip_name }}" -d /tmp/x
          DIR=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            DIR="/tmp/x/$(ls /tmp/x)"
          fi
          cp -a "$DIR"/. .

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply full AmberMail project" || echo "nothing to commit"
          git push
