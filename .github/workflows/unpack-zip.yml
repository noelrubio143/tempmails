name: Unpack release zip
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download zip from release "assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download assets -p "tempmails-main-complete.zip" -D /tmp/dl --repo "$GITHUB_REPOSITORY"
          ls -la /tmp/dl

      - name: Extract into repo
        run: |
          mkdir /tmp/x && unzip -q /tmp/dl/tempmails-main-complete.zip -d /tmp/x
          DIR=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            DIR="/tmp/x/$(ls /tmp/x)"
          fi
          rm -f "app/@" "deploy/#" "lib/#" "public/#"
          cp -a "$DIR"/. .

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project from release zip" || echo "nothing to commit"
          git push
