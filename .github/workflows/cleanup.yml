name: Delete Old Runs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_run:
    workflows: ["Unpack ZIP from Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the newest 5 runs, delete the rest
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 5
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="completed") | "\(.created_at) \(.id)"' \
            | sort -r \
            | tail -n +$((KEEP + 1)) \
            | awk '{print $2}' \
            | while read -r id; do
                echo "Deleting run $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" --silent || true
              done
