name: Unpack uploaded zip
on:
  push:
    branches: [main]
    paths: ["*.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip into repo
        run: |
          ZIP=$(ls -t *.zip | head -n1)
          mkdir /tmp/x && unzip -q "$ZIP" -d /tmp/x
          DIR=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            DIR="/tmp/x/$(ls /tmp/x)"
          fi
          rm -f "app/@" "deploy/#" "lib/#" "public/#"
          cp -a "$DIR"/. .
          rm -f "$ZIP"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack uploaded zip" || echo "nothing to commit"
          git push
